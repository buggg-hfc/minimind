<header><div><h1>MiniMind 训练交叉熵</h1><p>4 个随机种子 · Dense / MoE · 512 次 AdamW 更新</p></div><a href="#details">查看采样值 ↓</a></header>
<div class="panel">
<section class="filters" aria-label="实验和坐标选择">
<label for="seed">随机种子<select id="seed"><option selected>42</option><option>43</option><option>100</option><option>2026</option></select></label>

</section>
<section class="plot-area" aria-label="训练曲线">
<div class="plot-top"><div class="quick" role="group" aria-label="预设更新步区间">
<button data-range="5,65">早段 5–65</button><button data-range="230,290">中段 230–290</button><button data-range="455,512">后段 455–512</button><button id="reset-range">全程</button>
</div><div class="range-row"><label for="from-step">更新步</label><input id="from-step" type="number" min="5" max="512" value="455" aria-label="起始更新步"><span aria-hidden="true">–</span><input id="to-step" type="number" min="5" max="512" value="512" aria-label="结束更新步"><button id="apply-range">应用区间</button></div></div>

<div id="legend" role="group" aria-label="点击格式以显示或隐藏曲线"></div>

<div class="plot-caption"><strong id="range-summary"></strong><span>横向拖动放大 · 点击查看数值 · 左右键切换采样点</span></div>
</section>

</div>

    active.forEach((f, idx) => {
      const values = current.map(p => [x(p.step), y(metric(p, f.id))]);
      elem(traces,"path",{d:values.map(([px,py],i) => (i?"L":"M")+px.toFixed(2)+","+py.toFixed(2)).join(" "),
        stroke:f.color, fill:"none","stroke-width":1.7, "stroke-dasharray":f.dash || "none",
        "stroke-linecap":"round","stroke-linejoin":"round"});
      const every = current.length <= 16 ? 1 : Math.ceil(current.length / (compact ? 8 : 16));
      values.forEach(([px,py],i) => {
        if ((i+idx)%every === 0) marker(traces,px,py,f.mark,current.length <= 16 ? 2.8 : 2.0,f.color);
      });
    });
    hoverLayer = elem(svg,"g",{"pointer-events":"none"});
    brushLayer = elem(svg,"g",{"pointer-events":"none"});
    $("range-summary").textContent = "更新 " + windowStart + "–" + windowEnd + " · " + current.length + " 个采样点";
    controls.from.value = windowStart; controls.to.value = windowEnd;
    for (const btn of document.querySelectorAll("[data-range]")) {
      const [a,b] = btn.dataset.range.split(",").map(Number);
      btn.setAttribute("aria-pressed", String(windowStart === a && windowEnd === b));
    }
    updateLegend();
    inspect(sampleNearest(current, selected ? selected.step : current[current.length-1].step));
  }
  function applyRange(from, to) {
    if (!Number.isInteger(from) || !Number.isInteger(to) || from < 1 || to > series[series.length-1].step || from > to) {
      controls.error.textContent = "请输入 1 至 512 之间的整数，起点应小于或等于终点。";
      return;
    }
    const match = series.filter(row => row.step >= from && row.step <= to);
    if (!match.length) {
      controls.error.textContent = "该区间没有日志采样点，请扩大范围。";
      return;
    }
    controls.error.textContent = "";
    windowStart = match[0].step; windowEnd = match[match.length-1].step;
    draw();
  }
  function resetRange() { applyRange(series[0].step, series[series.length-1].step); }
  function changeSet() {
    series = data.get(controls.seed.value + "/" + controls.arch.value);
    if (!series) throw new Error("没有此组实验数据");
    controls.error.textContent = "";
    if (windowStart == null) {
      const initialStart = Number(controls.from.value) || 455;
      const initialEnd = Number(controls.to.value) || 512;
      applyRange(initialStart, initialEnd);
    } else draw();
  }
  function px(event) {
    const point = svg.createSVGPoint(); point.x = event.clientX; point.y = event.clientY;
    return point.matrixTransform(svg.getScreenCTM().inverse());
  }
  function stepAt(x) {
    const {left, right} = geometry;
    const frac = Math.max(0, Math.min(1, (x-left)/(right-left)));
    return sampleNearest(current, windowStart + frac*(windowEnd-windowStart));
  }
  function inside(p) {
    return p.x>=geometry.left && p.x<=geometry.right && p.y>=geometry.top && p.y<=geometry.bottom;
  }
  svg.addEventListener("pointerdown", event => {
    if (!event.isPrimary || event.button !== 0) return;
    const p=px(event);
    if (!inside(p)) return;
    drag = {id:event.pointerId, x:p.x};
    svg.setPointerCapture(event.pointerId);
    svg.focus({preventScroll:true});
    inspect(stepAt(p.x));
  });
  svg.addEventListener("pointermove", event => {
    if (drag && event.pointerId !== drag.id) return;
    const p=px(event);
    if (!drag && !inside(p)) return;
    const sample = stepAt(p.x);
    if (sample !== selected) inspect(sample);
    if (drag) {
      brushLayer.replaceChildren();
      const end = Math.max(geometry.left, Math.min(geometry.right,p.x));
      elem(brushLayer,"rect",{x:Math.min(drag.x,end),y:geometry.top,width:Math.abs(end-drag.x),
        height:geometry.bottom-geometry.top,fill:"#4875BC","fill-opacity":.15,stroke:"#4875BC","stroke-width":.8});
    }
  });
  svg.addEventListener("pointerup", event => {
    if (!drag || event.pointerId !== drag.id) return;
    const start = drag.x, end = px(event).x;
    drag=null; brushLayer.replaceChildren();
    if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
    if (Math.abs(end-start) >= 8) {
      const a=stepAt(start).step, b=stepAt(end).step;
      applyRange(Math.min(a,b),Math.max(a,b));
    } else inspect(stepAt(end));
  });
  svg.addEventListener("lostpointercapture", () => {
    drag=null;
    if (brushLayer) brushLayer.replaceChildren();
  });
  svg.addEventListener("dblclick", resetRange);
  svg.addEventListener("keydown", event => {
    if (!["ArrowLeft","ArrowRight","Home","End","Escape"].includes(event.key)) return;
    event.preventDefault();
    if (event.key === "Escape") return resetRange();
    let i=current.indexOf(selected);
    if (event.key === "Home") i=0;
    if (event.key === "End") i=current.length-1;
    if (event.key === "ArrowLeft") i=Math.max(0,i-1);
    if (event.key === "ArrowRight") i=Math.min(current.length-1,i+1);
    inspect(current[i]);
  });
  controls.seed.addEventListener("change", changeSet);
  controls.arch.addEventListener("change", changeSet);
  for (const c of [controls.mode, controls.reference]) c.addEventListener("change", draw);
  $("apply-range").addEventListener("click", () => applyRange(Number(controls.from.value),Number(controls.to.value)));
  for (const field of [controls.from,controls.to]) field.addEventListener("keydown", event => {
    if (event.key === "Enter") { event.preventDefault(); $("apply-range").click(); }
  });
  $("reset-range").addEventListener("click", resetRange);
  for (const btn of document.querySelectorAll("[data-range]"))
    btn.addEventListener("click", () => applyRange(...btn.dataset.range.split(",").map(Number)));
  configureLegend(); changeSet();
  function resized() {
    if (Math.max(260, Math.round(svg.getBoundingClientRect().width || 860)) !== widthAtDraw) draw();
  }
  if ("ResizeObserver" in window) new ResizeObserver(resized).observe(svg);
  else window.addEventListener("resize", resized);
})();
</script></body></html>
